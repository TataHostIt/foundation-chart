apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "universal-app.fullname" . }}
  namespace: {{ default .Release.Namespace .Values.namespace }}
  labels:
    {{- include "universal-app.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "universal-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "universal-app.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "universal-app.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      initContainers:
        # --- INFISICAL SECRET FETCHING ---
        {{- if .Values.infisical.enabled }}
        - name: fetch-infisical-secrets
          image: {{ .Values.infisical.image | default "infisical/config-operator:latest" }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Authenticating with Machine Identity..."
              export INFISICAL_TOKEN=$(infisical login --method=universal-auth --client-id=$MACHINE_IDENTITY_ID --client-secret=$CLIENT_SECRET --plain --silent)
              
              # Using .Values.environment to target the specific Infisical environment
              echo "Fetching secrets for Project: {{ .Values.infisical.projectId }} [Env: {{ .Values.environment }}]"
              touch /shared/{{ .Values.infisical.fileName | default "app.env" }}
              
              {{- range .Values.infisical.folders }}
              echo "Exporting: /{{ . }}"
              # Added --env flag mapped to your Helm environment variable
              infisical export --path "/{{ . }}" \
                               --projectId="{{ $.Values.infisical.projectId }}" \
                               --env="{{ $.Values.environment }}" \
                               --format dotenv >> /shared/{{ $.Values.infisical.fileName | default "app.env" }}
              {{- end }}
          env:
            - name: INFISICAL_API_URL
              valueFrom:
                secretKeyRef:
                  name: { { .Values.infisical.secretName | default "infisical-creds" } }
                  key: host-url
            - name: MACHINE_IDENTITY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.infisical.secretName | default "infisical-creds" }}
                  key: identity-id
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.infisical.secretName | default "infisical-creds" }}
                  key: client-secret
          volumeMounts:
            - name: infisical-shared-secrets
              mountPath: /shared
        {{- end }}
        # --- END INFISICAL ---
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.project }}/{{ .Values.image.name | default .Values.applicationName }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP

          env:
            {{- if .Values.environment }}
            - name: APP_ENV
              value: {{ .Values.environment | quote }}
            {{- end }}
            {{- if .Values.namespace }}
            - name: APP_NAMESPACE
              value: {{ .Values.namespace | quote }}
            {{- end }}

            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}

          {{- if .Values.envFrom }}
          envFrom:
            {{- toYaml .Values.envFrom | nindent 12 }}
          {{- end }}

          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- toYaml (omit .Values.livenessProbe "enabled") | nindent 12 }}
          {{- end }}

          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- toYaml (omit .Values.readinessProbe "enabled") | nindent 12 }}
          {{- end }}

          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            {{- toYaml (omit .Values.startupProbe "enabled") | nindent 12 }}
          {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            {{- if .Values.infisical.enabled }}
            - name: infisical-shared-secrets
              mountPath: {{ .Values.infisical.mountPath | default "/app/secrets" }}
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

      {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
      {{- end }}

      volumes:
        {{- if .Values.infisical.enabled }}
        - name: infisical-shared-secrets
          emptyDir: {}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}