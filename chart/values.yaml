# -----------------------------------------------------------------------
# UNIVERSAL MICROSERVICE CHART - DEFAULT VALUES
# -----------------------------------------------------------------------

# Global Application Identity
applicationName: "my-app"       # Overrides the chart name in resource names
environment: "dv"               # Injected as APP_ENV variable
namespace: "default"            # (Optional) Can be used for internal logic
replicaCount: 1

# -----------------------------------------------------------------------
# CONTAINER CONFIGURATION
# -----------------------------------------------------------------------
containerPort: 8080             # The internal port your app listens on
contextPath: "/"                # Default base path for Ingress fallback

image:
  # 1. Define the Registry and Project explicitly
  registry: "harbor.tatahostit.com"
  project: "library"
  # 2. Image Name: Leave empty to default to 'applicationName' (test-agent)
  # Only set this if the docker image name differs from the app name.
  name: ""
  pullPolicy: IfNotPresent
  tag: ""

# Secrets for pulling images from private registries (e.g. Harbor)
imagePullSecrets: []
  # - name: harbor-registry-secret

# -----------------------------------------------------------------------
# HEALTH CHECKS (PROBES)
# -----------------------------------------------------------------------
# These are the DEFAULTs.
# To disable: set enabled: false in your values-dv.yaml
# To custom: override the httpGet/exec block completely in your values file.

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 20
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

startupProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 10

# -----------------------------------------------------------------------
# NETWORKING
# -----------------------------------------------------------------------
service:
  type: ClusterIP
  port: 80
  # targetPort is automatically set to .Values.containerPort
  name: http

ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: app.tatahostit.com
      # OPTION A: Leave paths empty to use global 'contextPath'
      # OPTION B: Define specific paths here to override
      paths: []
      #  - path: /api/v1
      #    pathType: Prefix
      #  - path: /static
      #    pathType: Prefix
  tls: []
  #  - secretName: app-tls-cert
  #    hosts:
  #      - app.tatahostit.com

# -----------------------------------------------------------------------
# CONFIGURATION & SECRETS
# -----------------------------------------------------------------------
# 1. Simple Key-Value pairs
env: {}
  # LOG_LEVEL: "info"

# 2. Bulk load from Secrets/ConfigMaps
envFrom: []
  # - secretRef:
  #     name: my-app-sealed-secrets

# -----------------------------------------------------------------------
# RESOURCES & AUTOSCALING
# -----------------------------------------------------------------------
resources:
  limits:
    cpu: "1"
    memory: "1Gi"
  requests:
    cpu: "100m"
    memory: "128Mi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# -----------------------------------------------------------------------
# OBSERVABILITY
# -----------------------------------------------------------------------
serviceMonitor:
  enabled: false
  labels:
    release: prometheus # Standard label for Prometheus Operator
  interval: 30s
  path: /metrics
  port: http

# -----------------------------------------------------------------------
# ADVANCED / SECURITY
# -----------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

sidecars: []
initContainers: []

nodeSelector: {}
tolerations: []
affinity: {}
volumes: []
volumeMounts: []

infisical:
  enabled: false
  projectId: ""      # Pass from app-specific values.yaml
  folders: []        # e.g., ["common", "db"]
  secretName: "infisical-creds"
  mountPath: "/app/secrets"
  fileName: "app.env"
  image: "infisical/cli:0.43.55"